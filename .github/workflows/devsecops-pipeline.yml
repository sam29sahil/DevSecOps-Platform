name: DevSecOps Pipeline

"on":
  workflow_dispatch:
    inputs:
      repository_url:
        description: 'Submitted GitHub repository HTTPS URL'
        required: true
        type: string
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'
        type: string
      pipeline_id:
        description: 'Pipeline ID'
        required: true
        type: string
      run_id:
        description: 'Pipeline Run ID'
        required: true
        type: string
      project_id:
        description: 'Project ID'
        required: false
        default: ''
        type: string
      service_name:
        description: 'ECS Service Name (e.g. devsecops-srv-273)'
        required: false
        default: ''
        type: string
      deployment_id:
        description: 'Deployment ID'
        required: false
        default: ''
        type: string
      container_port:
        description: 'Container application port'
        required: false
        default: '8000'
        type: string
      health_check_path:
        description: 'Application HTTP health check path'
        required: false
        default: '/health'
        type: string
      callback_url:
        description: 'Base URL for Flask status callback'
        required: false
        default: ''
        type: string
      docker_enabled:
        description: 'Whether Docker build is enabled'
        required: false
        default: 'true'
        type: string
      registry_enabled:
        description: 'Whether AWS ECR registry push is enabled'
        required: false
        default: 'true'
        type: string
      deployment_enabled:
        description: 'Whether deployment is enabled'
        required: false
        default: 'true'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  devsecops:
    name: Build, Scan, Push & Deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: devsecops-platform
      ECR_REGISTRY: 288418346751.dkr.ecr.ap-south-1.amazonaws.com
      ECS_CLUSTER: devsecops-cluster
      OIDC_ROLE: arn:aws:iam::288418346751:role/DevSecOpsPlatform-GitHubActions
      CALLBACK_URL: ${{ inputs.callback_url }}
      CALLBACK_SECRET: ${{ secrets.DEVSECOPS_CALLBACK_SECRET || secrets.GITHUB_CALLBACK_SECRET }}
      RUN_ID: ${{ inputs.run_id }}
      PIPELINE_ID: ${{ inputs.pipeline_id }}
      PROJECT_ID: ${{ inputs.project_id }}
      SERVICE_NAME: ${{ inputs.service_name }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      CONTAINER_PORT: ${{ inputs.container_port || '8000' }}
      HEALTH_PATH: ${{ inputs.health_check_path || '/health' }}

    steps:
      - name: Log Pipeline Metadata
        run: |
          echo "============================================================"
          echo " DevSecOps Pipeline Execution"
          echo " Repository:     ${{ inputs.repository_url }}"
          echo " Branch:         ${{ inputs.branch }}"
          echo " Project ID:     ${{ inputs.project_id }}"
          echo " Pipeline ID:    ${{ inputs.pipeline_id }}"
          echo " Run ID:         ${{ inputs.run_id }}"
          echo " Service Name:   ${{ inputs.service_name }}"
          echo " Deployment ID:  ${{ inputs.deployment_id }}"
          echo " Container Port: ${{ inputs.container_port || '8000' }}"
          echo " Health Path:    ${{ inputs.health_check_path || '/health' }}"
          echo " Docker:         ${{ inputs.docker_enabled }}"
          echo " ECR Push:       ${{ inputs.registry_enabled }}"
          echo " Deployment:     ${{ inputs.deployment_enabled }}"
          echo "============================================================"

      - name: Setup Status Callback Utility
        run: |
          cat << 'EOF' > /usr/local/bin/send_callback
          #!/usr/bin/env bash
          set -e

          STAGE="$1"
          STATUS="$2"
          MESSAGE="$3"
          DETAILS="${4:-{}}"
          ERROR="${5:-}"

          if [ -z "${CALLBACK_URL}" ] || [ -z "${CALLBACK_SECRET}" ]; then
            echo "[CALLBACK] Notice: CALLBACK_URL or CALLBACK_SECRET not set. Skipping callback for stage '${STAGE}' (${STATUS})."
            exit 0
          fi

          if ! echo "${DETAILS}" | jq empty 2>/dev/null; then
            DETAILS="{}"
          fi

          PAYLOAD=$(jq -n \
            --arg stage "${STAGE}" \
            --arg status "${STATUS}" \
            --arg message "${MESSAGE}" \
            --argjson details "${DETAILS}" \
            --arg error "${ERROR}" \
            '{
              stage: $stage,
              status: $status,
              message: $message,
              details: $details,
              error: (if $error != "" then $error else null end)
            }')

          echo "[CALLBACK] Stage: ${STAGE} | Status: ${STATUS} | Run: ${RUN_ID}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${CALLBACK_URL}/api/pipelines/runs/${RUN_ID}/github-status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CALLBACK_SECRET}" \
            -d "${PAYLOAD}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "[CALLBACK] Successfully updated stage '${STAGE}' (HTTP ${HTTP_CODE})."
          else
            echo "[CALLBACK] Warning: Server returned HTTP ${HTTP_CODE}: ${BODY}"
          fi
          EOF
          chmod +x /usr/local/bin/send_callback

      - name: Checkout Target Repository
        run: |
          echo "Checking out user repository: ${{ inputs.repository_url }} (branch: ${{ inputs.branch }})..."
          mkdir -p target-repo
          if git clone --depth 1 --branch "${{ inputs.branch }}" "${{ inputs.repository_url }}" target-repo; then
            echo "Successfully cloned branch '${{ inputs.branch }}'."
          else
            echo "Branch '${{ inputs.branch }}' not found or clone failed; attempting default branch clone..."
            git clone --depth 1 "${{ inputs.repository_url }}" target-repo
          fi

      - name: Install Security Scanners
        run: |
          echo "Installing Trivy..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Stage 2 - Filesystem Dependency & Secret Scan
        run: |
          echo "Running filesystem vulnerability scan on target repository..."
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed target-repo || true

      - name: Stage 6 - Docker Build
        id: docker_build
        run: |
          if [ "${{ inputs.docker_enabled }}" != "true" ]; then
            echo "Docker build is disabled for this pipeline."
            send_callback "docker_build" "skipped" "Docker build disabled for this pipeline."
            send_callback "container_scan" "skipped" "Container scan skipped because Docker build is disabled."
            send_callback "registry_push" "skipped" "Registry push skipped because Docker build is disabled."
            send_callback "deployment" "skipped" "Deployment skipped because Docker build is disabled."
            echo "docker_skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f "target-repo/Dockerfile" ]; then
            echo "No Dockerfile found in target repository."
            send_callback "docker_build" "skipped" "No Dockerfile found in target repository."
            send_callback "container_scan" "skipped" "No container image available to scan."
            send_callback "registry_push" "skipped" "No container image available to push."
            send_callback "deployment" "skipped" "No container image available to deploy."
            echo "docker_skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          send_callback "docker_build" "running" "Building Docker image in GitHub Actions..."

          cd target-repo
          COMMIT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          IMAGE_TAG="${PIPELINE_ID}-${RUN_ID}-${COMMIT_SHA}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building image: ${FULL_IMAGE} (tag: ${IMAGE_TAG}, port: ${CONTAINER_PORT})..."
          echo "FULL_IMAGE_NAME=${FULL_IMAGE}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          if docker build --build-arg PORT="${CONTAINER_PORT}" -t "${FULL_IMAGE}" .; then
            echo "Docker build completed successfully."
            send_callback "docker_build" "success" "Docker image built successfully in GitHub Actions." "{\"image\":\"${FULL_IMAGE}\",\"tag\":\"${IMAGE_TAG}\"}"
          else
            BUILD_ERR="Docker build failed in GitHub Actions."
            echo "${BUILD_ERR}"
            send_callback "docker_build" "failed" "${BUILD_ERR}" "{}" "${BUILD_ERR}"
            exit 1
          fi

      - name: Stage 7 - Container Security Scan
        if: steps.docker_build.outputs.docker_skipped != 'true'
        run: |
          send_callback "container_scan" "running" "Scanning container image with Trivy..."
          echo "Running Trivy image vulnerability scan on ${FULL_IMAGE_NAME}..."

          if trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${FULL_IMAGE_NAME}"; then
            echo "Trivy container scan passed."
            send_callback "container_scan" "success" "Container security scan passed." "{\"image\":\"${FULL_IMAGE_NAME}\"}"
          else
            SCAN_ERR="Container security scan found HIGH or CRITICAL vulnerabilities."
            echo "${SCAN_ERR}"
            send_callback "container_scan" "failed" "${SCAN_ERR}" "{}" "${SCAN_ERR}"
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        if: steps.docker_build.outputs.docker_skipped != 'true' && (inputs.registry_enabled == 'true' || inputs.deployment_enabled == 'true')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288418346751:role/DevSecOpsPlatform-GitHubActions
          aws-region: ap-south-1

      - name: Stage 8 - Registry Push
        if: steps.docker_build.outputs.docker_skipped != 'true'
        run: |
          if [ "${{ inputs.registry_enabled }}" != "true" ]; then
            echo "Registry push disabled for this pipeline."
            send_callback "registry_push" "skipped" "Registry push disabled for this pipeline."
            exit 0
          fi

          send_callback "registry_push" "running" "Pushing container image to AWS ECR..."

          echo "Authenticating with Amazon ECR (${ECR_REGISTRY})..."
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          echo "Pushing ${FULL_IMAGE_NAME} to AWS ECR..."
          if docker push "${FULL_IMAGE_NAME}"; then
            echo "Image pushed successfully to AWS ECR."
            send_callback "registry_push" "success" "Container image pushed to AWS ECR." "{\"image\":\"${FULL_IMAGE_NAME}\"}"
          else
            PUSH_ERR="Failed to push container image to AWS ECR."
            echo "${PUSH_ERR}"
            send_callback "registry_push" "failed" "${PUSH_ERR}" "{}" "${PUSH_ERR}"
            exit 1
          fi

      - name: Stage 9 - AWS ECS Fargate Deployment
        if: steps.docker_build.outputs.docker_skipped != 'true'
        run: |
          if [ "${{ inputs.deployment_enabled }}" != "true" ]; then
            echo "Deployment disabled for this pipeline."
            send_callback "deployment" "skipped" "Deployment disabled for this pipeline."
            exit 0
          fi

          send_callback "deployment" "running" "Deploying application to AWS ECS Fargate..."

          if python3 - <<'PY'
          import os, sys, time, json, urllib.request
          import boto3

          region = os.environ.get('AWS_REGION', 'ap-south-1')
          cluster = os.environ.get('ECS_CLUSTER', 'devsecops-cluster')
          pipeline_id = os.environ.get('PIPELINE_ID', '1')
          project_id = os.environ.get('PROJECT_ID', '').strip()
          run_id = os.environ.get('RUN_ID', '1')
          image_uri = os.environ.get('FULL_IMAGE_NAME', '')
          deployment_id = os.environ.get('DEPLOYMENT_ID', '')
          port_str = os.environ.get('CONTAINER_PORT', '8000')
          health_path = os.environ.get('HEALTH_PATH', '/health').strip() or '/health'
          if not health_path.startswith('/'):
              health_path = '/' + health_path

          try:
              container_port = int(port_str)
          except Exception:
              container_port = 8000

          # Service naming: explicit SERVICE_NAME > devsecops-srv-{project_id} > devsecops-srv-{pipeline_id}
          service_name = (
              os.environ.get('SERVICE_NAME', '').strip()
              or (f'devsecops-srv-{project_id}' if project_id else f'devsecops-srv-{pipeline_id}')
          )
          family = f'devsecops-app-{project_id or pipeline_id}'

          print(f'Starting ECS Fargate Deployment for service {service_name} (family: {family}, image: {image_uri}, port: {container_port}, health: {health_path})...')

          ecs = boto3.client('ecs', region_name=region)
          ec2 = boto3.client('ec2', region_name=region)
          logs = boto3.client('logs', region_name=region)

          # 0. Ensure CloudWatch Log Group exists
          log_group = '/ecs/devsecops-apps'
          try:
              logs.create_log_group(logGroupName=log_group)
              print(f'Created CloudWatch log group: {log_group}')
          except Exception as e:
              if 'ResourceAlreadyExistsException' not in str(e):
                  print(f'Notice creating log group {log_group}: {e}')

          # 1. Register Task Definition with restricted execution role
          task_def_resp = ecs.register_task_definition(
              family=family,
              networkMode='awsvpc',
              requiresCompatibilities=['FARGATE'],
              cpu='256',
              memory='512',
              executionRoleArn='arn:aws:iam::288418346751:role/ecsTaskExecutionRole',
              containerDefinitions=[
                  {
                      'name': 'app',
                      'image': image_uri,
                      'essential': True,
                      'portMappings': [{'containerPort': container_port, 'protocol': 'tcp'}],
                      'environment': [
                          {'name': 'PORT', 'value': str(container_port)},
                      ],
                      'healthCheck': {
                          'command': [
                              'CMD-SHELL',
                              f'python -c "import urllib.request; urllib.request.urlopen(\'http://127.0.0.1:{container_port}{health_path}\', timeout=4)" || python -c "import urllib.request; urllib.request.urlopen(\'http://127.0.0.1:{container_port}/\', timeout=4)" || exit 1'
                          ],
                          'interval': 15,
                          'timeout': 5,
                          'retries': 3,
                          'startPeriod': 30,
                      },
                      'logConfiguration': {
                          'logDriver': 'awslogs',
                          'options': {
                              'awslogs-group': log_group,
                              'awslogs-region': region,
                              'awslogs-stream-prefix': f'app-{project_id or pipeline_id}',
                          }
                      }
                  }
              ],
          )
          task_def_arn = task_def_resp['taskDefinition']['taskDefinitionArn']
          print(f'Registered Task Definition: {task_def_arn}')

          # 2. VPC, Subnets & Dedicated Security Group (sg-045d13fc2f68c4551 / devsecops-fargate-sg)
          sg_id = 'sg-045d13fc2f68c4551'
          expected_vpc_id = 'vpc-060e8d89b763e19c3'

          sg_resp = ec2.describe_security_groups(GroupIds=[sg_id])['SecurityGroups']
          if not sg_resp:
              sys.exit(f'Dedicated ECS security group {sg_id} was not found in region {region}.')

          sg_info = sg_resp[0]
          sg_vpc_id = sg_info.get('VpcId')
          sg_name = sg_info.get('GroupName', '')
          if not sg_vpc_id:
              sys.exit(f'Dedicated ECS security group {sg_id} has no associated VPC.')
          if sg_vpc_id != expected_vpc_id:
              sys.exit(f'Security group {sg_id} belongs to VPC {sg_vpc_id}, expected {expected_vpc_id}.')

          subnet_objs = ec2.describe_subnets(Filters=[{'Name': 'vpc-id', 'Values': [sg_vpc_id]}])['Subnets']
          if not subnet_objs:
              sys.exit(f'No subnets found in VPC {sg_vpc_id} for security group {sg_id}.')

          selected_subnets = subnet_objs[:2]
          mismatched_subnets = [s['SubnetId'] for s in selected_subnets if s.get('VpcId') != sg_vpc_id]
          if mismatched_subnets:
              sys.exit(f'Subnet VPC mismatch for security group {sg_id} ({sg_vpc_id}): {mismatched_subnets}')

          subnets = [s['SubnetId'] for s in selected_subnets]
          print(f'Using dedicated security group: {sg_id} ({sg_name}) in VPC {sg_vpc_id} with subnets {subnets}')

          network_config = {
              'awsvpcConfiguration': {
                  'subnets': subnets,
                  'securityGroups': [sg_id],
                  'assignPublicIp': 'ENABLED',
              }
          }

          # 3. Create or Update Service
          existing_srvs = ecs.describe_services(cluster=cluster, services=[service_name])['services']
          active_srv = [s for s in existing_srvs if s.get('status') != 'INACTIVE']

          if active_srv:
              print(f'Updating ECS service {service_name} with security group {sg_id}...')
              ecs.update_service(
                  cluster=cluster,
                  service=service_name,
                  taskDefinition=task_def_arn,
                  desiredCount=1,
                  networkConfiguration=network_config,
                  forceNewDeployment=True,
              )
          else:
              print(f'Creating ECS Fargate service {service_name} with security group {sg_id}...')
              ecs.create_service(
                  cluster=cluster,
                  serviceName=service_name,
                  taskDefinition=task_def_arn,
                  desiredCount=1,
                  launchType='FARGATE',
                  networkConfiguration=network_config,
              )

          # 4. Wait until ECS reports service stable
          print(f'Waiting for ECS service {service_name} to become stable...')
          try:
              waiter = ecs.get_waiter('services_stable')
              waiter.wait(
                  cluster=cluster,
                  services=[service_name],
                  WaiterConfig={'Delay': 10, 'MaxAttempts': 30}
              )
              print(f'ECS service {service_name} reached STABLE state.')
          except Exception as wait_err:
              print(f'Waiter notice: {wait_err}. Checking task status directly...')

          # 5. Discover running task & public IP
          public_ip = None
          task_arn = None
          task_status = 'UNKNOWN'
          for attempt in range(20):
              tasks = ecs.list_tasks(cluster=cluster, serviceName=service_name)['taskArns']
              if tasks:
                  task_details = ecs.describe_tasks(cluster=cluster, tasks=tasks)['tasks']
                  running_tasks = [t for t in task_details if t.get('lastStatus') == 'RUNNING']
                  if running_tasks:
                      t = running_tasks[0]
                      task_arn = t['taskArn']
                      task_status = t.get('lastStatus', 'RUNNING')
                      for attachment in t.get('attachments', []):
                          for detail in attachment.get('details', []):
                              if detail.get('name') == 'networkInterfaceId':
                                  eni_id = detail.get('value')
                                  eni = ec2.describe_network_interfaces(NetworkInterfaceIds=[eni_id])['NetworkInterfaces'][0]
                                  public_ip = eni.get('Association', {}).get('PublicIp')
                                  break
                      if public_ip:
                          break
              time.sleep(5)

          if not public_ip:
              sys.exit('Could not determine Public IP for ECS task within timeout.')

          live_url = f'http://{public_ip}:{container_port}'
          print(f'Discovered Live Application URL: {live_url}')

          # 6. Verify Application Health Endpoint (/health first, then / fallback)
          health_ok = False
          verified_path = None
          probe_paths = [health_path]
          if health_path != '/':
              probe_paths.append('/')
          for _ in range(15):
              for probe in probe_paths:
                  try:
                      req = urllib.request.Request(f'{live_url}{probe}', method='GET')
                      with urllib.request.urlopen(req, timeout=5) as resp:
                          if resp.status < 500:
                              health_ok = True
                              verified_path = probe
                              print(f'Health check passed on {live_url}{probe} (HTTP {resp.status})')
                              break
                  except Exception:
                      pass
              if health_ok:
                  break
              time.sleep(5)

          details_dict = {
              'app_url': live_url,
              'ecs_service': service_name,
              'ecs_cluster': cluster,
              'task_arn': task_arn or '',
              'task_status': task_status,
              'container_port': container_port,
              'deployment_id': deployment_id,
              'image': image_uri,
              'health_status': 'healthy' if health_ok else 'unhealthy',
              'verified_path': verified_path or health_path,
          }

          with open('/tmp/deploy_details.json', 'w') as f:
              json.dump(details_dict, f)

          if not health_ok:
              sys.exit(f'Application health check failed: neither {live_url}{health_path} nor {live_url}/ responded with HTTP < 500')
          PY
          then
            DEPLOY_DETAILS=$(cat /tmp/deploy_details.json)
            APP_URL=$(jq -r '.app_url' /tmp/deploy_details.json)
            ECS_SVC=$(jq -r '.ecs_service' /tmp/deploy_details.json)

            echo "Deployment succeeded: ${DEPLOY_DETAILS}"
            echo "### AWS ECS Fargate Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **ECS Cluster**: \`${ECS_CLUSTER}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **ECS Service**: \`${ECS_SVC}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Image URI**: \`${FULL_IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Public URL**: ${APP_URL}" >> $GITHUB_STEP_SUMMARY
            send_callback "deployment" "success" "Application deployed successfully to AWS ECS Fargate." "${DEPLOY_DETAILS}"
          else
            DEPLOY_ERR="AWS ECS Fargate deployment or health check failed."
            echo "${DEPLOY_ERR}"
            send_callback "deployment" "failed" "${DEPLOY_ERR}" "{}" "${DEPLOY_ERR}"
            exit 1
          fi
