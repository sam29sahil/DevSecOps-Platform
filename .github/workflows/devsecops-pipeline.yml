name: DevSecOps Pipeline

"on":
  workflow_dispatch:
    inputs:
      repository_url:
        description: 'Submitted GitHub repository HTTPS URL'
        required: true
        type: string
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'
        type: string
      pipeline_id:
        description: 'Pipeline ID'
        required: true
        type: string
      run_id:
        description: 'Pipeline Run ID'
        required: true
        type: string
      callback_url:
        description: 'Base URL for Flask status callback'
        required: false
        default: ''
        type: string
      docker_enabled:
        description: 'Whether Docker build is enabled'
        required: false
        default: 'true'
        type: string
      registry_enabled:
        description: 'Whether AWS ECR registry push is enabled'
        required: false
        default: 'false'
        type: string
      deployment_enabled:
        description: 'Whether Render deployment is enabled'
        required: false
        default: 'false'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  devsecops:
    name: Build, Scan, Push & Deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: devsecops-platform
      ECR_REGISTRY: 288418346751.dkr.ecr.ap-south-1.amazonaws.com
      OIDC_ROLE: arn:aws:iam::288418346751:role/DevSecOpsPlatform-GitHubActions
      CALLBACK_URL: ${{ inputs.callback_url }}
      CALLBACK_SECRET: ${{ secrets.DEVSECOPS_CALLBACK_SECRET }}
      RUN_ID: ${{ inputs.run_id }}
      PIPELINE_ID: ${{ inputs.pipeline_id }}

    steps:
      - name: Log Pipeline Metadata
        run: |
          echo "============================================================"
          echo " DevSecOps Pipeline Execution"
          echo " Repository:   ${{ inputs.repository_url }}"
          echo " Branch:       ${{ inputs.branch }}"
          echo " Pipeline ID:  ${{ inputs.pipeline_id }}"
          echo " Run ID:       ${{ inputs.run_id }}"
          echo " Docker:       ${{ inputs.docker_enabled }}"
          echo " ECR Push:     ${{ inputs.registry_enabled }}"
          echo " Deployment:   ${{ inputs.deployment_enabled }}"
          echo "============================================================"

      - name: Setup Status Callback Utility
        run: |
          cat << 'EOF' > /usr/local/bin/send_callback
          #!/usr/bin/env bash
          set -e

          STAGE="$1"
          STATUS="$2"
          MESSAGE="$3"
          DETAILS="${4:-{}}"
          ERROR="${5:-}"

          if [ -z "${CALLBACK_URL}" ] || [ -z "${CALLBACK_SECRET}" ]; then
            echo "[CALLBACK] Notice: CALLBACK_URL or CALLBACK_SECRET not set. Skipping callback for stage '${STAGE}' (${STATUS})."
            exit 0
          fi

          if ! echo "${DETAILS}" | jq empty 2>/dev/null; then
            DETAILS="{}"
          fi

          PAYLOAD=$(jq -n \
            --arg stage "${STAGE}" \
            --arg status "${STATUS}" \
            --arg message "${MESSAGE}" \
            --argjson details "${DETAILS}" \
            --arg error "${ERROR}" \
            '{
              stage: $stage,
              status: $status,
              message: $message,
              details: $details,
              error: (if $error != "" then $error else null end)
            }')

          echo "[CALLBACK] Stage: ${STAGE} | Status: ${STATUS} | Run: ${RUN_ID}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${CALLBACK_URL}/api/pipelines/runs/${RUN_ID}/github-status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CALLBACK_SECRET}" \
            -d "${PAYLOAD}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "[CALLBACK] Successfully updated stage '${STAGE}' (HTTP ${HTTP_CODE})."
          else
            echo "[CALLBACK] Warning: Server returned HTTP ${HTTP_CODE}: ${BODY}"
          fi
          EOF
          chmod +x /usr/local/bin/send_callback

      - name: Checkout Target Repository
        run: |
          echo "Checking out user repository: ${{ inputs.repository_url }} (branch: ${{ inputs.branch }})..."
          mkdir -p target-repo
          if git clone --depth 1 --branch "${{ inputs.branch }}" "${{ inputs.repository_url }}" target-repo; then
            echo "Successfully cloned branch '${{ inputs.branch }}'."
          else
            echo "Branch '${{ inputs.branch }}' not found or clone failed; attempting default branch clone..."
            git clone --depth 1 "${{ inputs.repository_url }}" target-repo
          fi

      - name: Install Trivy Security Scanner
        run: |
          echo "Installing Trivy security scanner..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Filesystem Security Scan
        shell: bash
        run: |
          echo "Running filesystem security check on target repository..."
          send_callback "filesystem_scan" "running" "Scanning dependencies and repository secrets with Trivy..."
          if trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 target-repo; then
            send_callback "filesystem_scan" "success" "Trivy filesystem security scan passed."
          else
            SCAN_ERR="Filesystem security gate failed: Trivy found HIGH/CRITICAL issues or could not complete the scan."
            send_callback "filesystem_scan" "failed" "${SCAN_ERR}" "{}" "${SCAN_ERR}"
            exit 1
          fi

      - name: Detect Project & Prepare Dockerfile
        id: project_detect
        if: inputs.docker_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DETECTION_COMPLETED=false
          trap 'if [ "${DETECTION_COMPLETED:-false}" != "true" ]; then DETECT_ERR="Automatic project detection or Dockerfile generation failed."; send_callback "project_detection" "failed" "${DETECT_ERR}" "{}" "${DETECT_ERR}" || true; fi' EXIT
          send_callback "project_detection" "running" "Detecting the application framework and preparing a build configuration..."
          ROOT="target-repo"

          if [ -f "$ROOT/Dockerfile" ]; then
            APP_TYPE="docker"
            echo "Using the repository's existing Dockerfile."
          elif [ -f "$ROOT/package.json" ]; then
            HAS_START=$(node -e "const p=require('./$ROOT/package.json'); process.stdout.write(p.scripts?.start ? 'yes' : 'no')")
            HAS_BUILD=$(node -e "const p=require('./$ROOT/package.json'); process.stdout.write(p.scripts?.build ? 'yes' : 'no')")
            IS_VITE=$(grep -q '"vite"' "$ROOT/package.json" && echo yes || echo no)

            if [ "$HAS_BUILD" = "yes" ] && [ "$IS_VITE" = "yes" ] && [ "$HAS_START" = "no" ]; then
              APP_TYPE="vite-static"
              cat > "$ROOT/Dockerfile" <<'DOCKERFILE'
          FROM node:20-alpine AS build
          WORKDIR /app
          COPY package*.json ./
          RUN if [ -f package-lock.json ]; then npm ci; else npm install; fi
          COPY . .
          RUN npm run build
          FROM nginx:alpine
          COPY --from=build /app/dist /usr/share/nginx/html
          RUN sed -i 's/listen       80;/listen       10000;/' /etc/nginx/conf.d/default.conf
          EXPOSE 10000
          DOCKERFILE
            elif [ "$HAS_START" = "yes" ]; then
              APP_TYPE="node"
              cat > "$ROOT/Dockerfile" <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN if [ -f package-lock.json ]; then npm ci; else npm install; fi
          COPY . .
          RUN npm run build --if-present && npm prune --omit=dev
          ENV NODE_ENV=production
          EXPOSE 10000
          CMD ["sh", "-c", "npm start"]
          DOCKERFILE
            else
              echo "::error::Node.js project detected, but a supported start script or Vite build script was not found."
              exit 1
            fi
          elif [ -f "$ROOT/requirements.txt" ]; then
            if grep -qiE '(^|[[:space:]])fastapi([=<>~![:space:]]|$)' "$ROOT/requirements.txt"; then
              APP_TYPE="fastapi"
              if [ -f "$ROOT/app/main.py" ]; then MODULE="app.main:app"
              elif [ -f "$ROOT/main.py" ]; then MODULE="main:app"
              else
                echo "::error::FastAPI detected, but app/main.py or main.py was not found."
                exit 1
              fi
              cat > "$ROOT/Dockerfile" <<DOCKERFILE
          FROM python:3.12-slim
          WORKDIR /app
          COPY requirements.txt ./
          RUN pip install --no-cache-dir -r requirements.txt uvicorn[standard]
          COPY . .
          EXPOSE 10000
          CMD ["sh", "-c", "uvicorn $MODULE --host 0.0.0.0 --port ${PORT:-10000}"]
          DOCKERFILE
            elif grep -qiE '(^|[[:space:]])flask([=<>~![:space:]]|$)' "$ROOT/requirements.txt"; then
              APP_TYPE="flask"
              if [ -f "$ROOT/app.py" ]; then MODULE="app:app"
              elif [ -f "$ROOT/run.py" ]; then MODULE="run:app"
              elif [ -f "$ROOT/main.py" ]; then MODULE="main:app"
              elif [ -f "$ROOT/app/__init__.py" ] && grep -q 'create_app' "$ROOT/app/__init__.py"; then MODULE="app:create_app()"
              else
                echo "::error::Flask detected, but no supported app.py, run.py, main.py, or app factory was found."
                exit 1
              fi
              cat > "$ROOT/Dockerfile" <<DOCKERFILE
          FROM python:3.12-slim
          WORKDIR /app
          COPY requirements.txt ./
          RUN pip install --no-cache-dir -r requirements.txt gunicorn
          COPY . .
          EXPOSE 10000
          CMD ["sh", "-c", "gunicorn --bind 0.0.0.0:${PORT:-10000} $MODULE"]
          DOCKERFILE
            else
              echo "::error::Python dependencies detected, but this first automatic builder supports Flask and FastAPI. Add a Dockerfile for other Python frameworks."
              exit 1
            fi
          else
            echo "::error::Could not detect a supported application. Add a Dockerfile, a Node package.json with a start script, a Vite build, or a Python requirements.txt for Flask/FastAPI."
            exit 1
          fi

          echo "Detected application type: $APP_TYPE"
          echo "APP_TYPE=$APP_TYPE" >> "$GITHUB_ENV"
          echo "app_type=$APP_TYPE" >> "$GITHUB_OUTPUT"
          DETECTION_COMPLETED=true
          send_callback "project_detection" "success" "Detected application type: ${APP_TYPE}." "{\\"app_type\\":\\"${APP_TYPE}\\"}"

      - name: Skip Project Detection when Docker is disabled
        if: inputs.docker_enabled != 'true'
        run: |
          send_callback "project_detection" "skipped" "Docker build is disabled; automatic build detection was skipped."

      - name: Stage 6 - Docker Build
        id: docker_build
        run: |
          if [ "${{ inputs.docker_enabled }}" != "true" ]; then
            echo "Docker build is disabled for this pipeline."
            send_callback "docker_build" "skipped" "Docker build disabled for this pipeline."
            send_callback "container_scan" "skipped" "Container scan skipped because Docker build is disabled."
            send_callback "registry_push" "skipped" "Registry push skipped because Docker build is disabled."
            send_callback "deployment" "skipped" "Deployment skipped because Docker build is disabled."
            echo "docker_skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f "target-repo/Dockerfile" ]; then
            echo "No Dockerfile found in target repository."
            send_callback "docker_build" "skipped" "No Dockerfile found in target repository."
            send_callback "container_scan" "skipped" "No container image available to scan."
            send_callback "registry_push" "skipped" "No container image available to push."
            send_callback "deployment" "skipped" "No container image available to deploy."
            echo "docker_skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          send_callback "docker_build" "running" "Building Docker image in GitHub Actions..."

          cd target-repo
          COMMIT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          IMAGE_TAG="${PIPELINE_ID}-${RUN_ID}-${COMMIT_SHA}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building image: ${FULL_IMAGE} (tag: ${IMAGE_TAG})..."
          echo "FULL_IMAGE_NAME=${FULL_IMAGE}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          if docker build --platform linux/amd64 -t "${FULL_IMAGE}" .; then
            echo "Docker build completed successfully."
            send_callback "docker_build" "success" "Detected ${APP_TYPE:-docker}; application image built successfully." "{\"image\":\"${FULL_IMAGE}\",\"tag\":\"${IMAGE_TAG}\"}"
          else
            BUILD_ERR="Docker build failed in GitHub Actions."
            echo "${BUILD_ERR}"
            send_callback "docker_build" "failed" "${BUILD_ERR}" "{}" "${BUILD_ERR}"
            exit 1
          fi

      - name: Stage 7 - Container Security Scan
        if: steps.docker_build.outputs.docker_skipped != 'true'
        run: |
          send_callback "container_scan" "running" "Scanning container image with Trivy..."
          echo "Running Trivy image vulnerability scan on ${FULL_IMAGE_NAME}..."

          if trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${FULL_IMAGE_NAME}"; then
            echo "Trivy container scan passed."
            send_callback "container_scan" "success" "Container security scan passed." "{\"image\":\"${FULL_IMAGE_NAME}\"}"
          else
            SCAN_ERR="Container security scan found HIGH or CRITICAL vulnerabilities."
            echo "${SCAN_ERR}"
            send_callback "container_scan" "failed" "${SCAN_ERR}" "{}" "${SCAN_ERR}"
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        if: steps.docker_build.outputs.docker_skipped != 'true' && inputs.registry_enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288418346751:role/DevSecOpsPlatform-GitHubActions
          aws-region: ap-south-1

      - name: Stage 8 - Registry Push
        if: steps.docker_build.outputs.docker_skipped != 'true'
        run: |
          if [ "${{ inputs.registry_enabled }}" != "true" ]; then
            echo "Registry push disabled for this pipeline."
            send_callback "registry_push" "skipped" "Registry push disabled for this pipeline."
            exit 0
          fi

          send_callback "registry_push" "running" "Pushing container image to AWS ECR..."

          echo "Authenticating with Amazon ECR (${ECR_REGISTRY})..."
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          echo "Pushing ${FULL_IMAGE_NAME} to AWS ECR..."
          if docker push "${FULL_IMAGE_NAME}"; then
            echo "Image pushed successfully to AWS ECR."
            send_callback "registry_push" "success" "Container image pushed to AWS ECR." "{\"image\":\"${FULL_IMAGE_NAME}\"}"
          else
            PUSH_ERR="Failed to push container image to AWS ECR."
            echo "${PUSH_ERR}"
            send_callback "registry_push" "failed" "${PUSH_ERR}" "{}" "${PUSH_ERR}"
            exit 1
          fi

      - name: Stage 9 - Automatic Render Deployment
        if: steps.docker_build.outputs.docker_skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.deployment_enabled }}" != "true" ]; then
            echo "Deployment disabled for this pipeline."
            send_callback "deployment" "skipped" "Deployment disabled for this pipeline."
            exit 0
          fi

          if [ "${{ inputs.registry_enabled }}" != "true" ]; then
            DEPLOY_ERR="Automatic Render deployment requires AWS ECR push to be enabled."
            send_callback "deployment" "failed" "${DEPLOY_ERR}" "{}" "${DEPLOY_ERR}"
            exit 1
          fi

          send_callback "deployment" "running" "Creating or reusing a Render service for the submitted repository..."

          if ! DEPLOY_JSON=$(curl -fsS -X POST "${CALLBACK_URL}/api/pipelines/runs/${RUN_ID}/render-deploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CALLBACK_SECRET}" \
            -d "$(jq -n --arg image "${FULL_IMAGE_NAME}" '{image_url:$image}')"); then
            DEPLOY_ERR="Backend could not start the automatic Render deployment. Check RENDER_API_KEY, RENDER_OWNER_ID, and ECR access in backend environment variables."
            send_callback "deployment" "failed" "${DEPLOY_ERR}" "{}" "${DEPLOY_ERR}"
            exit 1
          fi

          echo "${DEPLOY_JSON}" | jq -e '.success == true' >/dev/null || {
            DEPLOY_ERR=$(echo "${DEPLOY_JSON}" | jq -r '.error // "Render deployment could not be started."')
            send_callback "deployment" "failed" "${DEPLOY_ERR}" "{}" "${DEPLOY_ERR}"
            exit 1
          }

          echo "Render accepted the deployment. Waiting for it to become live..."
          for attempt in $(seq 1 90); do
            if STATUS_JSON=$(curl -fsS "${CALLBACK_URL}/api/pipelines/runs/${RUN_ID}/render-deploy-status" \
              -H "Authorization: Bearer ${CALLBACK_SECRET}"); then
              STATUS=$(echo "${STATUS_JSON}" | jq -r '.status // "unknown"')
              IS_LIVE=$(echo "${STATUS_JSON}" | jq -r '.success // false')
              IS_TERMINAL=$(echo "${STATUS_JSON}" | jq -r '.terminal // false')
              APP_URL=$(echo "${STATUS_JSON}" | jq -r '.service_url // empty')

              if [ "${IS_LIVE}" = "true" ] && [ -n "${APP_URL}" ]; then
                DETAILS=$(jq -n \
                  --arg url "${APP_URL}" \
                  --arg service_id "$(echo "${STATUS_JSON}" | jq -r '.service_id // empty')" \
                  --arg deploy_id "$(echo "${STATUS_JSON}" | jq -r '.deploy_id // empty')" \
                  --arg image "${FULL_IMAGE_NAME}" \
                  --arg app_type "${APP_TYPE:-docker}" \
                  '{url:$url,service_url:$url,service_id:$service_id,deploy_id:$deploy_id,image:$image,app_type:$app_type}')
                send_callback "deployment" "success" "Application is live at ${APP_URL}" "${DETAILS}"
                echo "Deployment successful: ${APP_URL}"
                exit 0
              fi

              if [ "${IS_TERMINAL}" = "true" ]; then
                DEPLOY_ERR="Render deployment ended with status: ${STATUS}"
                send_callback "deployment" "failed" "${DEPLOY_ERR}" "${STATUS_JSON}" "${DEPLOY_ERR}"
                exit 1
              fi
              echo "Render deployment status: ${STATUS} (attempt ${attempt}/90)"
            else
              echo "Render status check failed temporarily (attempt ${attempt}/90)."
            fi
            sleep 10
          done

          DEPLOY_ERR="Timed out waiting for Render to report a live deployment after 15 minutes."
          send_callback "deployment" "failed" "${DEPLOY_ERR}" "{}" "${DEPLOY_ERR}"
          exit 1
