name: Deploy DevSecOps Platform to AWS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      ecs_cluster:
        description: 'Target ECS Cluster'
        required: false
        default: 'devsecops-cluster'
      ecs_service:
        description: 'Target ECS Service'
        required: false
        default: 'devsecops-platform-service'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '288418346751'
  OIDC_ROLE_ARN: arn:aws:iam::288418346751:role/DevSecOpsPlatform-GitHubActions
  ECR_REPOSITORY: devsecops-platform
  ECS_CLUSTER: ${{ github.event.inputs.ecs_cluster || 'devsecops-cluster' }}
  ECS_SERVICE: ${{ github.event.inputs.ecs_service || 'devsecops-platform-service' }}
  EXECUTION_ROLE_ARN: arn:aws:iam::288418346751:role/ecsTaskExecutionRole

jobs:
  test-and-build:
    name: Test & Build Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          python -m pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  deploy-to-aws:
    name: Deploy to AWS ECS Fargate
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Platform Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: platform-${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:platform-latest"

          echo "Building Docker image: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" -t "${IMAGE_LATEST}" -f Dockerfile .

          echo "Pushing Docker images to ECR..."
          docker push "${IMAGE_URI}"
          docker push "${IMAGE_LATEST}"

          echo "PLATFORM_IMAGE=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Ensure CloudWatch Log Group Exists
        run: |
          aws logs create-log-group --log-group-name /ecs/devsecops-platform --region ${{ env.AWS_REGION }} || true

      - name: Register ECS Task Definition
        id: task-def
        env:
          EXECUTION_ROLE_ARN: ${{ env.EXECUTION_ROLE_ARN }}
          PLATFORM_IMAGE: ${{ env.PLATFORM_IMAGE }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          python3 -c "
          import os, json

          task_def = {
              'family': 'devsecops-platform-task',
              'networkMode': 'awsvpc',
              'requiresCompatibilities': ['FARGATE'],
              'cpu': '512',
              'memory': '1024',
              'executionRoleArn': os.environ['EXECUTION_ROLE_ARN'],
              'containerDefinitions': [
                  {
                      'name': 'devsecops-platform',
                      'image': os.environ['PLATFORM_IMAGE'],
                      'essential': True,
                      'portMappings': [
                          {
                              'containerPort': 5000,
                              'hostPort': 5000,
                              'protocol': 'tcp'
                          }
                      ],
                      'healthCheck': {
                          'command': [
                              'CMD-SHELL',
                              'python -c \"import urllib.request; urllib.request.urlopen(\\'http://127.0.0.1:5000/api/health\\', timeout=3)\"'
                          ],
                          'interval': 30,
                          'timeout': 5,
                          'retries': 3,
                          'startPeriod': 60
                      },
                      'logConfiguration': {
                          'logDriver': 'awslogs',
                          'options': {
                              'awslogs-group': '/ecs/devsecops-platform',
                              'awslogs-region': os.environ['AWS_REGION'],
                              'awslogs-stream-prefix': 'platform'
                          }
                      },
                      'environment': [
                          {'name': 'PORT', 'value': '5000'},
                          {'name': 'AWS_REGION', 'value': os.environ['AWS_REGION']},
                          {'name': 'AWS_ECS_CLUSTER', 'value': os.environ['ECS_CLUSTER']},
                          {'name': 'AWS_ECR_REPOSITORY', 'value': os.environ['ECR_REPOSITORY']}
                      ]
                  }
              ]
          }

          with open('/tmp/platform-task-def.json', 'w') as f:
              json.dump(task_def, f, indent=2)
          "
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/platform-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered Task Definition: ${TASK_DEF_ARN}"
          echo "TASK_DEF_ARN=${TASK_DEF_ARN}" >> $GITHUB_ENV

      - name: Update or Create ECS Fargate Service
        run: |
          SERVICE_EXISTS=$(aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} --query 'services[?status==`ACTIVE`].serviceName' --output text || echo "")

          # Discover default VPC subnets and dedicated security group
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query "Vpcs[0].VpcId" --output text)
          if [ -z "${VPC_ID}" ] || [ "${VPC_ID}" = "None" ]; then
            VPC_ID=$(aws ec2 describe-vpcs --query "Vpcs[0].VpcId" --output text)
          fi

          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${VPC_ID}" --query "Subnets[0:2].SubnetId" --output text | tr '\t' ',')
          
          # Look for dedicated devsecops-fargate-sg first, fallback to default
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${VPC_ID}" "Name=group-name,Values=devsecops-fargate-sg" --query "SecurityGroups[0].GroupId" --output text)
          if [ -z "${SG_ID}" ] || [ "${SG_ID}" = "None" ]; then
            SG_ID=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${VPC_ID}" "Name=group-name,Values=default" --query "SecurityGroups[0].GroupId" --output text)
          fi

          if [ -n "${SERVICE_EXISTS}" ] && [ "${SERVICE_EXISTS}" != "None" ]; then
            echo "Updating existing service ${{ env.ECS_SERVICE }}..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.ECS_SERVICE }} \
              --task-definition ${{ env.TASK_DEF_ARN }} \
              --force-new-deployment
          else
            echo "Creating new ECS Fargate service ${{ env.ECS_SERVICE }}..."
            aws ecs create-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --task-definition ${{ env.TASK_DEF_ARN }} \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG_ID}],assignPublicIp=ENABLED}"
          fi

      - name: Verify Platform Health & Discover Live URL
        run: |
          echo "============================================================"
          echo " Starting Native ECS Container Health Verification"
          echo " Cluster:         ${{ env.ECS_CLUSTER }}"
          echo " Service:         ${{ env.ECS_SERVICE }}"
          echo " Task Definition: ${{ env.TASK_DEF_ARN }}"
          echo "============================================================"

          TARGET_TASK_DEF="${{ env.TASK_DEF_ARN }}"
          POLL_TIMEOUT=300
          POLL_INTERVAL=10
          ELAPSED=0
          ACTIVE_TASK_ARN=""
          CONTAINER_HEALTH="UNKNOWN"
          TASK_STATUS=""

          while [ ${ELAPSED} -lt ${POLL_TIMEOUT} ]; do
            # 1. Retrieve active task ARNs for the service
            TASK_ARNS=$(aws ecs list-tasks \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --service-name "${{ env.ECS_SERVICE }}" \
              --desired-status RUNNING \
              --query 'taskArns' \
              --output text 2>/dev/null || echo "")

            if [ -n "${TASK_ARNS}" ] && [ "${TASK_ARNS}" != "None" ]; then
              # 2. Inspect active tasks to find the task registered with TARGET_TASK_DEF
              ACTIVE_TASK_ARN=$(aws ecs describe-tasks \
                --cluster "${{ env.ECS_CLUSTER }}" \
                --tasks ${TASK_ARNS} \
                --query 'tasks[?taskDefinitionArn==`'"${TARGET_TASK_DEF}"'`].taskArn | [0]' \
                --output text 2>/dev/null || echo "")

              if [ -n "${ACTIVE_TASK_ARN}" ] && [ "${ACTIVE_TASK_ARN}" != "None" ]; then
                TASK_STATUS=$(aws ecs describe-tasks \
                  --cluster "${{ env.ECS_CLUSTER }}" \
                  --tasks "${ACTIVE_TASK_ARN}" \
                  --query 'tasks[0].lastStatus' \
                  --output text 2>/dev/null || echo "UNKNOWN")

                CONTAINER_HEALTH=$(aws ecs describe-tasks \
                  --cluster "${{ env.ECS_CLUSTER }}" \
                  --tasks "${ACTIVE_TASK_ARN}" \
                  --query 'tasks[0].containers[0].healthStatus' \
                  --output text 2>/dev/null || echo "UNKNOWN")

                echo "[Elapsed: ${ELAPSED}s] Task: ${ACTIVE_TASK_ARN##*/} | Task Status: ${TASK_STATUS} | Container Health: ${CONTAINER_HEALTH}"

                # 3. Check for successful container health
                if [ "${TASK_STATUS}" = "RUNNING" ] && [ "${CONTAINER_HEALTH}" = "HEALTHY" ]; then
                  echo "SUCCESS: Container health check verified as HEALTHY!"
                  break
                fi

                # 4. Check for task failure / premature stop
                if [ "${TASK_STATUS}" = "STOPPED" ]; then
                  STOP_REASON=$(aws ecs describe-tasks \
                    --cluster "${{ env.ECS_CLUSTER }}" \
                    --tasks "${ACTIVE_TASK_ARN}" \
                    --query 'tasks[0].stoppedReason' \
                    --output text 2>/dev/null || echo "Unknown")
                  CONTAINER_REASON=$(aws ecs describe-tasks \
                    --cluster "${{ env.ECS_CLUSTER }}" \
                    --tasks "${ACTIVE_TASK_ARN}" \
                    --query 'tasks[0].containers[0].reason' \
                    --output text 2>/dev/null || echo "None")
                  CONTAINER_EXIT=$(aws ecs describe-tasks \
                    --cluster "${{ env.ECS_CLUSTER }}" \
                    --tasks "${ACTIVE_TASK_ARN}" \
                    --query 'tasks[0].containers[0].exitCode' \
                    --output text 2>/dev/null || echo "None")

                  echo "::error::ECS Task stopped unexpectedly."
                  echo "Stopped Reason:    ${STOP_REASON}"
                  echo "Container Reason:  ${CONTAINER_REASON}"
                  echo "Exit Code:         ${CONTAINER_EXIT}"
                  exit 1
                fi

                if [ "${CONTAINER_HEALTH}" = "UNHEALTHY" ]; then
                  echo "::error::Container reported UNHEALTHY status."
                  aws ecs describe-tasks --cluster "${{ env.ECS_CLUSTER }}" --tasks "${ACTIVE_TASK_ARN}" --query 'tasks[0].containers[0]' --output json || true
                  exit 1
                fi
              else
                echo "[Elapsed: ${ELAPSED}s] Waiting for task with revision ${TARGET_TASK_DEF##*/} to start..."
              fi
            else
              echo "[Elapsed: ${ELAPSED}s] No active tasks found yet for service ${{ env.ECS_SERVICE }}..."
            fi

            sleep ${POLL_INTERVAL}
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          # 5. Enforce timeout check
          if [ "${CONTAINER_HEALTH}" != "HEALTHY" ]; then
            echo "::error::ECS Health Verification timed out after ${POLL_TIMEOUT}s."
            echo "Final Task Status:     ${TASK_STATUS}"
            echo "Final Health Status:   ${CONTAINER_HEALTH}"
            if [ -n "${ACTIVE_TASK_ARN}" ] && [ "${ACTIVE_TASK_ARN}" != "None" ]; then
              echo "Diagnostic dump for task ${ACTIVE_TASK_ARN}:"
              aws ecs describe-tasks --cluster "${{ env.ECS_CLUSTER }}" --tasks "${ACTIVE_TASK_ARN}" --output json || true
            fi
            exit 1
          fi

          # 6. Public IP Discovery (Without attempting runner HTTP access)
          echo "Discovering Public IP from Task Network Interface (ENI)..."
          ENI_ID=$(aws ecs describe-tasks \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --tasks "${ACTIVE_TASK_ARN}" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value | [0]' \
            --output text 2>/dev/null || echo "")

          PUBLIC_IP=""
          if [ -n "${ENI_ID}" ] && [ "${ENI_ID}" != "None" ]; then
            PUBLIC_IP=$(aws ec2 describe-network-interfaces \
              --network-interface-ids "${ENI_ID}" \
              --query 'NetworkInterfaces[0].Association.PublicIp' \
              --output text 2>/dev/null || echo "")
          fi

          if [ -z "${PUBLIC_IP}" ] || [ "${PUBLIC_IP}" = "None" ]; then
            echo "::warning::Could not determine Public IP address for active task."
            PUBLIC_URL="http://[Pending-Public-IP]:5000"
          else
            PUBLIC_URL="http://${PUBLIC_IP}:5000"
          fi

          echo "============================================================"
          echo " DEVSECOPS PLATFORM DEPLOYED SUCCESSFULLY"
          echo " Public Application URL: ${PUBLIC_URL}"
          echo " Task ARN:               ${ACTIVE_TASK_ARN}"
          echo " Container Health:       ${CONTAINER_HEALTH}"
          echo "============================================================"
