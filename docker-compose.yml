services:
  devsecops-platform:
    build: .
    image: devsecops-platform
    container_name: devsecops-platform
    restart: unless-stopped

    ports:
      - "5000:5000"

    # Runtime configuration lives in .env, which is git-ignored.  Copy
    # .env.example to .env and fill it in.
    env_file:
      - .env

    volumes:
      # Application database and the persisted Trivy vulnerability database.
      - ./data:/app/data

      # The pipeline builds and scans images with the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock

      # NOTE: the host Azure CLI profile is deliberately NOT mounted here.
      # A Windows CLI profile is not readable by the Linux container, and a
      # CLI user credential cannot be refreshed non-interactively under Entra
      # security defaults.  Azure authentication uses the service principal
      # configured in .env instead.
