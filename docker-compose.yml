services:
  devsecops-platform:
    build: .
    image: devsecops-platform
    container_name: devsecops-platform
    restart: unless-stopped

    ports:
      - "5000:5000"

    # Runtime configuration lives in .env, which is git-ignored.  Copy
    # .env.example to .env and fill it in.
    env_file:
      - .env

    volumes:
      # Application database and the persisted Trivy vulnerability database.
      - ./data:/app/data

      # The pipeline builds and scans images with the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
